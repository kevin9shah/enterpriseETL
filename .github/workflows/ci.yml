name: CI — Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  test:
    name: Pytest Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Provide dummy values so pydantic-settings doesn't fail on import
      EXCHANGE_RATE_API_KEY: "ci-dummy-key"
      DB_NAME: "test_db"
      DB_USER: "test_user"
      DB_PASS: "test_pass"
      DB_HOST: "localhost"
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            pyarrow \
            pandera==0.18.0 \
            sqlalchemy \
            psycopg2-binary \
            python-dotenv \
            pydantic-settings \
            pytest \
            pytest-mock

      - name: Run pytest
        run: pytest test/ -v --tb=short
