name: CI — Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    env:
      EXCHANGE_RATE_API_KEY: "ci-dummy-key"
      DB_NAME: "test_db"
      DB_USER: "test_user"
      DB_PASS: "test_pass"
      DB_HOST: "localhost"
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            pyarrow \
            pandera==0.18.0 \
            sqlalchemy \
            psycopg2-binary \
            python-dotenv \
            pydantic-settings \
            pytest \
            pytest-mock \
            ruff==0.15.15

      - name: Ruff lint
        run: |
          echo "ruff version: $(ruff --version)"
          echo "config check:"
          cat ruff.toml
          ruff check . --config ruff.toml

      - name: Run pytest
        run: pytest test/ -v --tb=short
