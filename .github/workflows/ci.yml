name: CI — Test Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    env:
      EXCHANGE_RATE_API_KEY: "ci-dummy-key"
      DB_NAME: "test_db"
      DB_USER: "test_user"
      DB_PASS: "test_pass"
      DB_HOST: "localhost"
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==2.1.4 \
            numpy==1.26.4 \
            pyarrow==24.0.0 \
            multimethod==1.10 \
            pandera==0.18.0 \
            sqlalchemy==1.4.52 \
            psycopg2-binary==2.9.12 \
            python-dotenv==1.2.2 \
            pydantic-settings \
            pytest==8.0.0 \
            pytest-mock==3.14.0

      - name: Run pytest
        run: pytest test/ -v --tb=short
